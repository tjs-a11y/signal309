name: Upload podcast audio to the CDN
# Uploads new or changed MP3s to object storage (R2/S3), verifies each one through the CDN domain,
# and commits podcast/cdn-manifest.json. That push triggers "Publish podcast feed", which then points
# those episodes at the CDN. Does nothing until the storage secrets and CDN_BASE_URL variable exist.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['podcast/*.mp3']
permissions:
  contents: write
concurrency: { group: media-upload, cancel-in-progress: false }
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
      - name: Upload (skipped until storage is configured)
        run: |
          if [ -z "$S3_BUCKET" ] || [ -z "$CDN_BASE_URL" ]; then
            echo "Object storage not configured yet; the feed keeps serving audio from GitHub Pages."
            exit 0
          fi
          node scripts/migrate-assets.mjs --upload
      - name: Commit the manifest
        run: |
          git config user.name "monad-staff-bot"; git config user.email "monad-staff-bot@users.noreply.github.com"
          git add podcast/cdn-manifest.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "CDN: record uploaded audio"
          git pull --rebase origin main && git push origin HEAD:main
